# superterminal configuration
#
# Location (first match wins):
#   $SUPERTERMINAL_CONFIG
#   $XDG_CONFIG_HOME/superterminal/config.toml
#   ~/.config/superterminal/config.toml                        (Linux)
#   ~/Library/Application Support/superterminal/config.toml    (macOS)
#
# Every section and every key is optional; anything missing falls back to
# the value shown here. Unknown keys are ignored with a warning. The file is
# read once at startup by both `superterminald` and the client - there is no
# hot reload yet.
#
# This file is generated by `st config init`; it lists the defaults.

# The monospaced family used for terminal cells.
[font]
# Family name. Unset means the platform default:
# "Menlo" on macOS, "DejaVu Sans Mono" on Linux.
# family = "JetBrains Mono"
# Font size in pixels.
size = 13.0
# Cell height as a multiple of the font size.
line_height = 1.2

# Window chrome and compositing.
[window]
# "auto" | "blurred" | "transparent" | "opaque".
# "auto" resolves to "blurred" on macOS and "opaque" on Linux;
# "blurred" behaves as "transparent" on Linux (no blur there).
background = "auto"
# Put the tab strip down the left edge instead of along the top.
vertical_tabs = false

# Pixels between the window edge and the cell grid.
# The scrollbar is drawn inside the right padding.
[window.padding]
top = 8.0
right = 8.0
bottom = 8.0
left = 8.0

# What the server spawns in a new Surface.
[shell]
# Unset means $SHELL, then /bin/sh.
# program = "/usr/bin/fish"
# Arguments passed to the program, before the login flag.
args = []
# Start as a login shell. `-l` is appended for bash, zsh and fish
# only. Unset means the platform default: true on macOS,
# false on Linux.
# login = true

# Emulation and interaction.
[terminal]
# Lines of history per Surface. Clamped to 100000.
scrollback_lines = 10000
# Draw bold text in indexed colours 0-7 with colours 8-15.
bold_is_bright = false
# Send arrow keys for wheel events on the alternate screen,
# so pagers such as `less` scroll.
alt_screen_scroll = true
# Characters that count as part of a word, in addition to
# letters and digits, when double-clicking to select.
word_chars = '/-+\~_.'
# macOS only: "none" | "left" | "right" | "both".
# Anything but "none" makes Option prefix ESC instead of
# composing characters.
option_as_alt = "none"
# "del" sends 0x7F (xterm default), "bs" sends 0x08 (^H).
backspace_sends = "del"

# Terminal palette. Every value is a hex colour ("#rrggbb", or the
# short "#rgb"). The server reads this section too, to answer OSC 10
# and OSC 11 colour queries.
[theme]
# Default text colour (OSC 10).
foreground = "#d4d4d4"
# Default background colour (OSC 11).
background = "#1e1e1e"
# Cursor block.
cursor = "#d4d4d4"
# Character underneath a block cursor.
cursor_text = "#1e1e1e"
# Background of selected cells.
selection_background = "#264f78"
# Foreground of selected cells.
selection_foreground = "#d4d4d4"

# The 16 ANSI colours, indexes 0-15.
black = "#000000"
red = "#cd3131"
green = "#0dbc79"
yellow = "#e5e510"
blue = "#2472c8"
magenta = "#bc3fbc"
cyan = "#11a8cd"
white = "#e5e5e5"
bright_black = "#666666"
bright_red = "#f14c4c"
bright_green = "#23d18b"
bright_yellow = "#f5f543"
bright_blue = "#3b8eea"
bright_magenta = "#d670d6"
bright_cyan = "#29b8db"
bright_white = "#ffffff"

# Shortcut overrides, `command id = "shortcut"`. Only the commands you
# list are changed; everything else keeps its built-in binding.
# `mod` is Cmd on macOS and Ctrl+Shift on Linux.
#
# Command ids: app.quit, app.reconnect, edit.copy, edit.paste,
# palette.commands, session.new, session.rename, session.switch,
# surface.clearScrollback, tab.close, tab.goto.1 .. tab.goto.9,
# tab.new, tab.next, tab.prev, view.toggleVerticalTabs.
[keybindings]
# "tab.new" = "mod+t"
# "palette.commands" = "mod+shift+p"

# The background server (`superterminald`).
[server]
# Exit after this many minutes with no clients connected and no
# Surface doing work. 0 disables idle exit.
idle_exit_minutes = 15.0
# Let programs write the clipboard with OSC 52. Off in v1.
osc52 = false
